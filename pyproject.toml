[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-bot"
version = "0.1.0"
description = "Dependency-free trading framework with backtesting and paper trading"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
trading-bot = "trading_bot.cli:main"

[tool.setuptools.packages.find]
include = ["trading_bot*"]
